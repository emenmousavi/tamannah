<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما - تمنا</title>
    <link rel="stylesheet" href="/css/contact.css">
</head>
<body>
    
    <!-- هدر دینامیک -->
    <div id="header"></div>
    
    <main>
        <section class="hero">
            <div class="container">
                <h1>تماس با ما</h1>
                <h2>با افتخار پاسخگوی شما هستیم</h2>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <h2>فرم تماس</h2>
                <div class="form-container">
                    <form name="contact"
                          method="POST"
                          netlify
                          netlify-honeypot="bot-field"
                          accept-charset="UTF-8"
                          action="/thankyou.html">
                        <input type="hidden" name="form-name" value="contact">
                        <p style="display:none;">
                            <label>Don't fill this out: <input name="bot-field"></label>
                        </p>
                        <div class="form-group">
                            <label for="full-name">نام کامل</label>
                            <input type="text" id="full-name" name="full_name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">ایمیل</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="reason">دلیل تماس</label>
                            <select id="reason" name="reason" required>
                                <option value="" disabled selected>انتخاب کنید</option>
                                <option value="poetry-question">پرسش درباره اشعار</option>
                                <option value="collaboration">همکاری</option>
                                <option value="feedback">انتقاد یا پیشنهاد</option>
                                <option value="other">سایر</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="description">توضیحات کامل</label>
                            <textarea id="description" name="description" required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">ارسال</button>
                    </form>
                </div>
            </div>
        </section>
        
        <section class="section">
            <div class="container">
                <h2>فرم تماس</h2>
                <div class="contact-links-list">
                <!-- آیتم ایمیل -->
                    <div class="contact-link-item">
                        <div class="contact-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                    <div class="contact-text">
                        <span class="contact-label">ایمیل پشتیبانی</span>
                        <a href="mailto:support@tamannah.website" class="contact-url">support@tamannah.website</a>
                    </div>
                </div>
            </div>
            
                <!-- آیتم اینستاگرام -->
                <div class="contact-link-item">
                    <div class="contact-icon instagram-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </div>
                    <div class="contact-text">
                        <span class="contact-label">اینستاگرام</span>
                        <a href="https://www.instagram.com/tamanna_poem/" target="_blank" rel="noopener" class="contact-url">instagram.com/tamanna_poem</a>
                    </div>
                </div>
            
                <!-- آیتم تلگرام -->
                <div class="contact-link-item">
                    <div class="contact-icon telegram-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.07-.78 4.18-1.82 6.97-3.02 8.37-3.61 3.98-1.66 4.81-1.94 5.35-1.95.12 0 .38.03.55.17.14.12.18.28.2.46-.02.07-.02.16-.04.28z"/>
                        </svg>
                    </div>
                    <div class="contact-text">
                        <span class="contact-label">کانال تلگرام</span>
                        <a href="https://t.me/ashkeghalb" target="_blank" rel="noopener" class="contact-url">t.me/ashkeghalb</a>
                    </div>
                </div>
            </div>
        </section>

    </main>
        
    <!-- اسکریپت اختصاصی مدیریت فرم تماس Netlify -->
    <script>
        (function () {
            const form = document.querySelector('form[name="contact"]');
            if (!form) return;
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                const action = form.getAttribute("action") || "/";
                const formData = new FormData(form);
                if (!formData.get("form-name")) formData.append("form-name", "contact");
                fetch("/", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams(formData).toString()
                }).then(function () {
                    window.location.href = action;
                }).catch(function () {
                    window.location.href = action;
                });
            });
        })();
    </script>
    
    <!-- فوتر دینامیک -->
    <div id="footer"></div>
    
    <script>
      // ۱. بارگذاری هدر و فعال‌سازی منوی همبرگری
      fetch("/_includes/header.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
            initMobileMenu();
        })
        .catch(err => console.error("خطا در بارگذاری هدر:", err));

      // ۲. بارگذاری فوتر
      fetch("/_includes/footer.html")
        .then(res => res.text())
        .then(data => document.getElementById("footer").innerHTML = data)
        .catch(err => console.error("خطا در بارگذاری فوتر:", err));

      // تابع راه‌اندازی و تعامل منوی همبرگری موبایل
      function initMobileMenu() {
          const hamburger = document.getElementById('hamburger');
          const mobileNav = document.getElementById('mobileNav');

          if (hamburger && mobileNav) {
              hamburger.addEventListener('click', function (e) {
                  e.stopPropagation();
                  hamburger.classList.toggle('open');
                  mobileNav.classList.toggle('active');
              });

              const mobileLinks = mobileNav.querySelectorAll('a');
              mobileLinks.forEach(link => {
                  link.addEventListener('click', () => {
                      hamburger.classList.remove('open');
                      mobileNav.classList.remove('active');
                  });
              });

              document.addEventListener('click', function (e) {
                  if (!mobileNav.contains(e.target) && !hamburger.contains(e.target)) {
                      hamburger.classList.remove('open');
                      mobileNav.classList.remove('active');
                  }
              });
          }
      }
    </script>
</body>
</html>
