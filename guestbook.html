<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دلنوشته های شما - تمنا</title>
    <link rel="stylesheet" href="/css/thank.css">
</head>
<body>

    <!-- هدر دینامیک -->
    <div id="header"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>دلنوشته‌های شما</h1>
                <h2>حس و حال خود را با ما به اشتراک بگذارید</h2>
            </div>
        </section>
    
        <section class="section">
            <div class="container">
                <!-- فرم ارسال دلنوشته -->
                <div class="thankyou-container" style="margin-bottom: 40px;">
                    <h3 style="margin-bottom: 20px; color: var(--primary-color);">ثبت دلنوشته جدید</h3>
                    <form id="guestbookForm">
                        <div style="margin-bottom: 15px;">
                            <input type="text" id="userName" placeholder="نام شما..." required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: 'Vazirmatn';">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <textarea id="userMessage" placeholder="متن دلنوشته..." rows="4" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: 'Vazirmatn';"></textarea>
                        </div>
                        <p id="errorMsg" style="color: red; font-size: 0.9rem; margin-bottom: 10px; display: none;"></p>
                        <button type="submit" style="background-color: var(--primary-color); color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-family: 'Vazirmatn'; font-weight: 700;">ارسال دلنوشته</button>
                    </form>
                </div>
    
                <!-- کادر نمایش دلنوشته‌های ثبت شده -->
                <div class="thankyou-container">
                    <h3 style="margin-bottom: 20px; color: var(--primary-color);">دلنوشته‌های مخاطبان</h3>
                    <div id="messagesList" style="text-align: right; display: flex; flex-direction: column; gap: 15px;">
                        <p style="text-align: center; color: #666;">در حال بارگذاری دلنوشته‌ها...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- فوتر دینامیک -->
    <div id="footer"></div>

    <!-- اسکریپت لود هدر و فوتر دینامیک -->
    <script>
      // ۱. بارگذاری هدر و فعال‌سازی منوی همبرگری
      fetch("/_includes/header.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
            initMobileMenu();
        })
        .catch(err => console.error("خطا در بارگذاری هدر:", err));

      // ۲. بارگذاری فوتر
      fetch("/_includes/footer.html")
        .then(res => res.text())
        .then(data => document.getElementById("footer").innerHTML = data)
        .catch(err => console.error("خطا در بارگذاری فوتر:", err));

      // تابع راه‌اندازی منوی همبرگری
      function initMobileMenu() {
          const hamburger = document.getElementById('hamburger');
          const mobileNav = document.getElementById('mobileNav');

          if (hamburger && mobileNav) {
              hamburger.addEventListener('click', function (e) {
                  e.stopPropagation();
                  hamburger.classList.toggle('open');
                  mobileNav.classList.toggle('active');
              });

              const mobileLinks = mobileNav.querySelectorAll('a');
              mobileLinks.forEach(link => {
                  link.addEventListener('click', () => {
                      hamburger.classList.remove('open');
                      mobileNav.classList.remove('active');
                  });
              });

              document.addEventListener('click', function (e) {
                  if (!mobileNav.contains(e.target) && !hamburger.contains(e.target)) {
                      hamburger.classList.remove('open');
                      mobileNav.classList.remove('active');
                  }
              });
          }
      }
    </script>

    <!-- اسکریپت فایربیس و مدیریت دلنوشته‌ها -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMNGd_qsoU32j6UfkOeWp3SZXJyuS9uNQ",
            authDomain: "tamanna-guestbook.firebaseapp.com",
            projectId: "tamanna-guestbook",
            storageBucket: "tamanna-guestbook.firebasestorage.app",
            messagingSenderId: "447487383782",
            appId: "1:447487383782:web:5448a34573d9fa9cda8327",
            measurementId: "G-BVTB6GQ6RL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // لیست کلمات رکیک یا نامناسب (می‌توانید موارد دلخواه را اضافه کنید)
        const badWords = ["فحش1", "فحش2", "بی ادب", "کلمه_نامناسب"];

        function containsBadWord(text) {
            const lowerText = text.toLowerCase();
            return badWords.some(word => lowerText.includes(word));
        }

        const form = document.getElementById('guestbookForm');
        const messagesList = document.getElementById('messagesList');
        const errorMsg = document.getElementById('errorMsg');

        // بارگذاری و نمایش پیام‌ها از فایربیس
        async function loadMessages() {
            messagesList.innerHTML = "";
            try {
                const q = query(collection(db, "guestbook"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    messagesList.innerHTML = '<p style="text-align: center; color: #666;">هنوز دلنوشته‌ای ثبت نشده است. اولین نفر باشید!</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    appendMessageToDOM(data.name, data.message);
                });
            } catch (error) {
                console.error("خطا در خواندن پیام‌ها: ", error);
                messagesList.innerHTML = '<p style="text-align: center; color: red;">خطا در بارگذاری دلنوشته‌ها.</p>';
            }
        }

        function appendMessageToDOM(name, message) {
            const messageCard = document.createElement('div');
            messageCard.style.cssText = "background: #f9f9f9; padding: 15px; border-radius: 6px; border-right: 4px solid var(--primary-color); text-align: right;";
            
            messageCard.innerHTML = `
                <h4 style="color: var(--primary-color); margin-bottom: 5px; font-size: 1rem;">${escapeHtml(name)}</h4>
                <p style="font-size: 0.95rem; color: #444; line-height: 1.6;">${escapeHtml(message)}</p>
            `;
            messagesList.appendChild(messageCard);
        }

        // ارسال فرم و ثبت در فایربیس
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('userName').value.trim();
            const message = document.getElementById('userMessage').value.trim();

            // فیلتر کلمات نامناسب
            if (containsBadWord(name) || containsBadWord(message)) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'متن یا نام وارد شده حاوی کلمات نامناسب است. لطفاً رعایت فرمایید.';
                return;
            }

            errorMsg.style.display = 'none';

            try {
                // ثبت در دیتابیس ابری فایربیس
                await addDoc(collection(db, "guestbook"), {
                    name: name,
                    message: message,
                    createdAt: serverTimestamp()
                });

                form.reset();
                loadMessages(); // به‌روزرسانی لیست پیام‌ها در صفحه
            } catch (error) {
                alert("خطا در ارسال پیام. لطفا دوباره تلاش کنید.");
                console.error("خطا: ", error);
            }
        });

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // بارگذاری اولیه پیام‌ها به محض باز شدن صفحه
        loadMessages();
    </script>
    
</body>
</html>
