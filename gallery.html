<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری واژه ها و نقش ها - تمنا</title>
    <link rel="stylesheet" href="/css/gallery.css">
</head>
<body>

    <!-- هدر دینامیک -->
    <div id="header"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>گالری تصاویر</h1>
                <h2>لحظاتی از زندگی تمنا و آثار او</h2>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <h2>تصاویر شخصی</h2>
                <div class="gallery-grid">
                </div>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <h2>گالری واژه‌ها و نقش‌ها</h2>
                <div class="gallery-grid">
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_1196%4023-05-2018_17-11-21.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۱">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_1608%4004-08-2019_18-02-53.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۲">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_1813%4016-04-2021_15-32-59.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۳">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_1909%4003-11-2021_16-09-43.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۴">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_1925%4016-11-2021_07-43-53.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۵">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_2053%4009-10-2022_15-54-20_thumb.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۶">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_2101%4009-04-2024_08-57-20_thumb.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۷">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_2106%4007-05-2024_13-32-22_thumb.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۸">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_2115%4027-08-2024_09-37-19_thumb.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۹">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_458%4005-07-2017_10-26-29.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۱۰">
                    </div>
                    <div class="gallery-item">
                        <img src="https://github.com/emenmousavi/tamannah/blob/main/images/gallery/photo_946%4006-12-2017_18-48-36_thumb.jpg?raw=true" alt="واژه‌ها و نقش‌ها ۱۱">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- فوتر دینامیک -->
    <div id="footer"></div>

    <!-- المان لایت‌باکس برای بزرگ‌نمایی تصاویر -->
    <div id="imageLightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightboxImage">
    </div>

    <!-- اسکریپت لایت‌باکس تصاویر -->
    <script>
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById('imageLightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const closeBtn = document.querySelector('.close');

        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                lightbox.style.display = "block";
                lightboxImage.src = item.src;
            });
        });

        closeBtn.addEventListener('click', () => {
            lightbox.style.display = "none";
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target.classList.contains('lightbox')) {
                lightbox.style.display = "none";
            }
        });
    </script>

    <!-- اسکریپت لود هدر و فوتر و منوی همبرگری -->
    <script>
      // ۱. بارگذاری هدر و فعال‌سازی منوی همبرگری
      fetch("/_includes/header.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
            initMobileMenu();
        })
        .catch(err => console.error("خطا در بارگذاری هدر:", err));

      // ۲. بارگذاری فوتر
      fetch("/_includes/footer.html")
        .then(res => res.text())
        .then(data => document.getElementById("footer").innerHTML = data)
        .catch(err => console.error("خطا در بارگذاری فوتر:", err));

      // تابع راه‌اندازی منوی همبرگری
      function initMobileMenu() {
          const hamburger = document.getElementById('hamburger');
          const mobileNav = document.getElementById('mobileNav');

          if (hamburger && mobileNav) {
              hamburger.addEventListener('click', function (e) {
                  e.stopPropagation();
                  hamburger.classList.toggle('open');
                  mobileNav.classList.toggle('active');
              });

              const mobileLinks = mobileNav.querySelectorAll('a');
              mobileLinks.forEach(link => {
                  link.addEventListener('click', () => {
                      hamburger.classList.remove('open');
                      mobileNav.classList.remove('active');
                  });
              });

              document.addEventListener('click', function (e) {
                  if (!mobileNav.contains(e.target) && !hamburger.contains(e.target)) {
                      hamburger.classList.remove('open');
                      mobileNav.classList.remove('active');
                  }
              });
          }
      }
    </script>
</body>
</html>
